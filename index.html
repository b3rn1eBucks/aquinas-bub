
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Aquinas Bub | Watercolor World v3</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Georgia,serif;background:#b7e3f5}button{cursor:pointer}#view{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;user-select:none}#view.drag{cursor:grabbing}#sky{position:absolute;inset:0;background:linear-gradient(#7dc9ee 0%,#b6e6f6 48%,#f5f0ce 100%)}.layer{position:absolute;inset:0;pointer-events:none;overflow:visible;will-change:transform}.art{position:absolute;max-width:none;pointer-events:none;object-fit:contain;transform-origin:center bottom}.top-art{transform-origin:center top}.world{position:absolute;left:0;top:0;height:100%;pointer-events:none}.meadow{position:absolute;top:77%;height:30%;width:100%;background:linear-gradient(180deg,#91bd70 0%,#80aa5e 55%,#6b9855 100%);clip-path:polygon(0 17%,3% 13%,7% 19%,12% 9%,17% 14%,23% 5%,29% 15%,35% 8%,40% 17%,46% 7%,53% 14%,60% 5%,66% 14%,73% 8%,80% 16%,86% 7%,93% 14%,100% 8%,100% 100%,0 100%)}.walk{position:absolute;top:82%;height:9%;background:#ecdab6;border-top:4px solid #f9ebcc;border-bottom:5px solid #b8a47e;box-shadow:0 5px 9px #526b4433;border-radius:45% 45% 30% 30%/25% 25% 20% 20%}.walk:after{content:"";position:absolute;inset:3px 0;background:repeating-linear-gradient(99deg,transparent 0 80px,#ac9a7a55 82px 85px,transparent 87px 160px)}.water{position:absolute;top:96%;height:14%;background:linear-gradient(#b7e4e5,#6fb8c6);border-top:5px solid #adc69a}.water:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 85px,#ffffff80 90px 94px,transparent 99px 190px)}.site{position:absolute;width:210px;height:170px;transform:translate(-50%,-100%);text-align:center}.house{position:absolute;bottom:0;left:15%;width:70%;height:63%;background:#f2dcb3;border:4px solid #917960;border-radius:5px;box-shadow:8px 9px 0 #344b3b33}.roof{position:absolute;left:5%;bottom:61%;width:90%;height:30%;background:#b77765;clip-path:polygon(50% 0,100% 95%,0 95%)}.door{position:absolute;bottom:0;left:40%;width:21%;height:42%;background:#856148;border:3px solid #684932;border-radius:25px 25px 0 0}.win{position:absolute;top:26%;width:17%;height:22%;background:#9fd5df;border:3px solid #79644d;border-radius:14px 14px 3px 3px}.win.one{left:13%}.win.two{right:13%}.garden{position:absolute;bottom:0;left:3%;width:94%;height:55%;border:7px solid #ab9169;border-radius:20px;background:repeating-linear-gradient(90deg,#699c4c 0 22px,#afd27a 22px 32px,#86664d 32px 41px)}.label{position:absolute;left:50%;bottom:-32px;transform:translateX(-50%);white-space:nowrap;background:#fff8e9ee;border:1px solid #c8b68e;border-radius:20px;padding:5px 9px;font:12px system-ui;color:#514332}.wheel{position:absolute;top:88%;width:86px;height:86px;border:11px dashed #815c3c;border-radius:50%;box-shadow:inset 0 0 0 7px #c09464;animation:spin 17s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.hud{position:fixed;z-index:50;left:12px;top:calc(12px + env(safe-area-inset-top));background:#fff9e9e9;border:1px solid #d7c7a6;border-radius:14px;padding:10px 13px;max-width:min(410px,calc(100vw - 24px));color:#4a473c;box-shadow:0 5px 20px #0002}.hud strong{font-size:16px}.hud small{display:block;font:12px/1.45 system-ui;margin-top:4px}.controls{position:fixed;z-index:51;right:12px;bottom:calc(15px + env(safe-area-inset-bottom));display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.controls button,.panel button{border:1px solid #b8a784;border-radius:18px;background:#fff9eb;color:#4c4639;padding:10px 12px;font:600 13px system-ui}.progress{position:fixed;z-index:55;bottom:0;left:0;width:100%;height:5px;background:#e5ddc7}.progress i{display:block;height:100%;width:0;background:#698c64}.panel{position:fixed;z-index:70;inset:8% 5% 10%;background:#fffdf5;border:2px solid #c5b18c;border-radius:15px;box-shadow:0 12px 65px #0006;display:none;flex-direction:column;overflow:hidden;font:13px/1.5 system-ui;color:#353026}.panel.open{display:flex}.panel header{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#eee7d6;padding:10px 15px}.panel main{padding:14px;overflow:auto}.panel pre{font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.panel p{color:#6a5a42}.hidden{display:none!important}
</style></head><body>
<div id="view"><div id="sky"></div></div>
<div class="hud"><strong>✦ Aquinas Bub's Monastery</strong><small>Swipe to explore the watercolor world · Version 3</small><small id="status">Loading scenery…</small></div>
<div class="controls"><button id="left">◀</button><button id="right">▶</button><button id="labels">Hide labels</button><button id="debug">Debug Images</button></div><div class="progress"><i id="bar"></i></div>
<div class="panel" id="panel"><header><strong>Image debug report</strong><button id="close">Close ✕</button></header><main><p>Failures are grouped by actual filename, not by repeated placements.</p><pre id="report"></pre><button id="copy">Copy report</button></main></div>
<script>
(()=>{'use strict';
const view=document.getElementById('view'),bar=document.getElementById('bar'),status=document.getElementById('status');const WORLD=11200;let width=innerWidth,height=innerHeight,pos=0,goal=0,down=false,last=0,loaded=0,failed=0,pending=0;const missing=new Map(),ok=new Set();
const specs=[['cloud',.09],['far',.18],['mid',.30],['hills',.46],['wood',.76],['terrain',1],['buildings',1],['flowers',1.12],['trunks',1.32],['branches',1.43]];const layers={};for(const [name,speed] of specs){let d=document.createElement('div');d.className='layer';d.dataset.speed=speed;view.appendChild(d);layers[name]=d}
function statusUpdate(){status.textContent=loaded+' loaded · '+failed+' failed · '+pending+' checking';if(document.getElementById('panel').classList.contains('open'))debugReport()}
function img(layer,folder,name,x,opts={}){let el=document.createElement('img');el.className='art'+(opts.top?' top-art':'');el.alt='';el.decoding='async';el.loading='eager';el.style.left=x+'px';if(opts.top)el.style.top=(opts.offset||0)+'px';else el.style.bottom=(opts.offset||0)+'px';el.style.height=(opts.h||200)+'px';el.style.width='auto';el.style.opacity=opts.opacity??1;el.style.transform='translateX('+(opts.anchor||0)+'%) scaleX('+(opts.flip?-1:1)+')';if(opts.blur)el.style.filter='blur('+opts.blur+'px)';layers[layer].appendChild(el);
const key='assets/'+folder+'/'+name,ext=['PNG','png','WEBP','webp'];let i=0,finished=false;pending++;el.onload=()=>{if(finished)return;finished=true;pending--;loaded++;ok.add(key);statusUpdate()};el.onerror=()=>{if(finished)return;i++;if(i<ext.length){el.src=key+'.'+ext[i];return}finished=true;pending--;failed++;missing.set(key,(missing.get(key)||0)+1);el.remove();statusUpdate()};el.src=key+'.'+ext[0];return el}
const H=()=>height;
// Scenery height and vertical anchoring are based on the screen, not fixed image widths.
for(let i=0;i<17;i++)img('cloud','clouds','clouds-0'+(i%5+1),i*700-220,{top:true,offset:H()*.12+(i%4)*H()*.075,h:H()*(.14+(i%3)*.035),opacity:.72,flip:i%3===1});
for(let i=0;i<14;i++)img('far','mountains','mountains-far-0'+(i%3+1),i*840-350,{offset:H()*.37,h:H()*.47,opacity:.72,flip:i%4===2});
for(let i=0;i<14;i++)img('mid','mountains','mountains-mid-0'+(i%3+1),i*820-270,{offset:H()*.29,h:H()*.49,opacity:.85,flip:i%3===1});
for(let i=0;i<17;i++)img('hills','hills','hills-0'+(i%4+1),i*710-250,{offset:H()*.19,h:H()*.47,flip:i%4===2});
// Midground trees are deliberately above the distant scenery, but behind paths/buildings.
for(let i=0;i<20;i++)img('wood','trees','trees-0'+(i%6+1),i*555-170,{offset:H()*.19,h:H()*(.34+(i%4)*.055),flip:i%3===0});
function div(parent,cls,style){let d=document.createElement('div');d.className=cls;Object.assign(d.style,style);parent.appendChild(d);return d}
let terrain=div(layers.terrain,'world',{width:WORLD+'px'}),built=div(layers.buildings,'world',{width:WORLD+'px'});
// The old hard-edged green band is gone; only a low, irregular meadow remains.
div(terrain,'meadow',{width:WORLD+'px'});div(terrain,'walk',{left:'0',width:WORLD+'px'});div(terrain,'water',{left:'0',width:WORLD+'px'});
function station(title,x,garden=false,rise=0){let s=div(built,'site',{left:x+'px',top:(79-rise)+'%'});if(garden){div(s,'garden',{})}else{let h=div(s,'house',{});div(s,'roof',{});div(h,'door',{});div(h,'win one',{});div(h,'win two',{})}let label=div(s,'label',{});label.textContent=title}
station('Elevated vegetable garden',570,true,9);station('Art studio',1600);station('Library',2580);station('Study workshop',3530);station('Cloister courtyard',4690);station('Marian grotto',5810,true,3);station('Kitchen',6810);station('Refectory',7860);station('Tree chapel',9110);station('Marketplace',10460);div(built,'wheel',{left:'800px'});
// Foreground plants are tall enough to reach into the scene, anchored below the viewport.
for(let i=0;i<30;i++)img('flowers','foreground','flowers-'+String(i%10+1).padStart(2,'0'),i*395-150,{offset:-H()*.07+(i%4)*H()*.015,h:H()*(.29+(i%5)*.055),flip:i%3===0});
// Trunks are deliberately enormous: a near-camera tree often exits the top of the screen.
for(let i=0;i<13;i++)img('trunks','foreground','trunk-0'+(i%4+1),i*900-150,{offset:-H()*.12,h:H()*(1.12+(i%3)*.22),flip:i%2===1,anchor:i%2===0?-16:0});
// Overhead branches are TOP-anchored. Their stems begin outside the upper edge.
for(let i=0;i<9;i++)img('branches','foreground','branches-0'+(i%4+1),i*1370-190,{top:true,offset:-H()*(.18+(i%3)*.035),h:H()*(.43+(i%3)*.12),flip:i%2===1});
function limit(){return Math.max(0,WORLD-width)}function move(dx){goal=Math.max(0,Math.min(limit(),goal+dx))}
function frame(){pos+=(goal-pos)*.16;if(Math.abs(pos-goal)<.1)pos=goal;for(const [name,speed] of specs){if(name==='terrain'){terrain.style.transform='translate3d('+(-pos)+'px,0,0)'}else if(name==='buildings'){built.style.transform='translate3d('+(-pos)+'px,0,0)'}else layers[name].style.transform='translate3d('+(-pos*speed)+'px,0,0)'}bar.style.width=(limit()?pos/limit()*100:0)+'%';requestAnimationFrame(frame)}requestAnimationFrame(frame);
view.addEventListener('wheel',e=>{e.preventDefault();move((Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY)*1.3)},{passive:false});view.addEventListener('pointerdown',e=>{down=true;last=e.clientX;view.classList.add('drag');view.setPointerCapture(e.pointerId)});view.addEventListener('pointermove',e=>{if(down){move((last-e.clientX)*1.4);last=e.clientX}});function release(){down=false;view.classList.remove('drag')}view.addEventListener('pointerup',release);view.addEventListener('pointercancel',release);
document.getElementById('left').onclick=()=>move(-width*.8);document.getElementById('right').onclick=()=>move(width*.8);let show=true;document.getElementById('labels').onclick=()=>{show=!show;document.querySelectorAll('.label').forEach(el=>el.classList.toggle('hidden',!show));document.getElementById('labels').textContent=show?'Hide labels':'Show labels'};
function textReport(){return ['Aquinas Bub v3 image report','Loaded placements: '+loaded,'Failed placements: '+failed,'Checking: '+pending,'Unique loaded files: '+ok.size,'Unique missing paths: '+missing.size,'',...([...missing].sort((a,b)=>a[0].localeCompare(b[0])).map(([path,n])=>path+'.PNG ('+n+' placements)'))].join('\n')}
function debugReport(){document.getElementById('report').textContent=textReport()}document.getElementById('debug').onclick=()=>{document.getElementById('panel').classList.add('open');debugReport()};document.getElementById('close').onclick=()=>document.getElementById('panel').classList.remove('open');document.getElementById('copy').onclick=()=>{let t=textReport();if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t).catch(()=>prompt('Copy:',t));else prompt('Copy:',t)};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(250);if(e.key==='ArrowLeft')move(-250)});addEventListener('resize',()=>{width=innerWidth;height=innerHeight;goal=Math.min(goal,limit())});statusUpdate();
})();
</script></body></html>
