<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>Aquinas Bub | Monastery Parallax Test</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Georgia,serif;background:#d7eefa;touch-action:pan-y}#view{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;user-select:none}#view.dragging{cursor:grabbing}#scene{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#77c4ed 0%,#b9e6f5 39%,#fff3d7 78%,#f8ebc9 100%)}.layer{position:absolute;inset:0;pointer-events:none;overflow:visible}.asset{position:absolute;display:block;object-fit:contain;max-width:none;pointer-events:none;transform-origin:center bottom;filter:drop-shadow(0 5px 7px rgba(38,65,35,.08))}.far{opacity:.69;filter:saturate(.83)}.mid{opacity:.88}.front{filter:drop-shadow(0 12px 11px rgba(30,50,24,.14))}.world{position:absolute;top:0;left:0;transform-origin:top left;pointer-events:none}.ground{position:absolute;top:57%;height:50%;background:linear-gradient(180deg,#a9c987,#87b66b 27%,#74a95c 80%,#6b9c56);border-top:8px solid #b9d28c;border-radius:48% 46% 0 0/7% 8% 0 0}.ground:after{content:'';position:absolute;inset:0;opacity:.27;background:repeating-linear-gradient(110deg,transparent 0 42px,#e2d69e 44px 45px,transparent 46px 100px)}.path{position:absolute;top:74%;height:11%;background:#e8d6ae;border-top:5px solid #f9edcf;border-bottom:5px solid #c4ac84;box-shadow:0 5px 0 #8c9c66;border-radius:45% 35% 20% 35%/40% 45% 30% 30%}.path:after{content:'';position:absolute;inset:6px 0;background:repeating-linear-gradient(100deg,transparent 0 61px,rgba(120,101,74,.22) 62px 65px,transparent 66px 119px);opacity:.8}.site{position:absolute;width:240px;height:210px;transform:translate(-50%,-100%);text-align:center}.building{position:absolute;bottom:0;left:15%;width:70%;height:65%;background:#f3dfbb;border:5px solid #967f65;border-radius:8px 8px 13px 13px;box-shadow:10px 11px 0 rgba(52,76,45,.17)}.roof{position:absolute;bottom:62%;left:4%;width:92%;height:28%;background:#bd7866;clip-path:polygon(50% 0,100% 90%,96% 100%,4% 100%,0 90%);filter:drop-shadow(0 4px 1px #7c574e)}.door{position:absolute;bottom:0;left:41%;width:22%;height:38%;background:#795a45;border:4px solid #654634;border-radius:36px 36px 0 0}.window{position:absolute;top:32%;width:18%;height:22%;background:#b1d9db;border:4px solid #806d59;border-radius:25px 25px 3px 3px}.window.a{left:13%}.window.b{right:13%}.site-label{position:absolute;left:50%;bottom:-31px;transform:translateX(-50%);white-space:nowrap;background:rgba(255,249,227,.91);color:#493c2f;border:1px solid #b8a783;border-radius:20px;padding:6px 13px;font-size:14px;box-shadow:0 3px 9px #4e563b21}.garden{position:absolute;bottom:0;left:2%;width:96%;height:55%;background:#b9a47b;border:7px solid #998261;border-radius:30px 30px 12px 12px}.beds{position:absolute;inset:15px;display:flex;gap:10px}.bed{flex:1;border-radius:25px;background:repeating-linear-gradient(0deg,#638d48 0 12px,#9fc86b 13px 21px,#725a3e 22px 27px)}.stairs{position:absolute;left:43%;bottom:-40px;width:18%;height:42px;background:repeating-linear-gradient(180deg,#e8d9b8 0 9px,#a99877 10px 12px)}.stream{position:absolute;top:91%;height:15%;background:linear-gradient(180deg,#a1d8db,#6ab4c4 48%,#b1e0d9);border-top:7px solid #d1c5a1;border-radius:50% 40% 0 0/20% 16% 0 0;opacity:.92}.stream:after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 75px,#e5ffff77 80px 86px,transparent 90px 180px);animation:water 6s linear infinite}@keyframes water{to{background-position:180px 0}}.wheel{position:absolute;top:82%;width:85px;height:85px;border:12px dashed #76543b;border-radius:50%;box-shadow:inset 0 0 0 7px #b78857;animation:spin 18s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.little{position:absolute;font-size:25px;opacity:.9}.hud{position:fixed;z-index:20;left:14px;top:calc(12px + env(safe-area-inset-top));background:#fff9e9e8;border:1px solid #d5c9a7;box-shadow:0 6px 24px #4c694029;border-radius:14px;padding:10px 13px;max-width:min(390px,calc(100vw - 28px));color:#514b3e}.hud strong{font-size:16px}.hud small{display:block;font:12px/1.5 system-ui;margin-top:4px}.controls{position:fixed;z-index:20;right:15px;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;gap:8px}.controls button{font:600 14px system-ui;padding:11px 15px;border:1px solid #a4a58a;border-radius:20px;background:#fff9e9ed;color:#4a4b3a;box-shadow:0 4px 12px #0002}.progress{position:fixed;bottom:0;left:0;width:100%;height:5px;background:#e9e1c6;z-index:25}.progress i{display:block;height:100%;background:#658e62;width:0%}.warning{position:fixed;left:14px;bottom:calc(17px + env(safe-area-inset-bottom));font:12px system-ui;background:#fff9e9d9;border-radius:9px;padding:7px 10px;z-index:15;color:#5d584c;max-width:50vw}.hidden{display:none!important}
</style></head><body><div id="view"><div id="scene"></div></div><div class="hud"><strong>✦ Aquinas Bub's Monastery</strong><small>Drag left/right, swipe, or use your mouse wheel to explore. Temporary buildings, real asset layers.</small><small id="status">Loading artwork…</small></div><div class="warning" id="hint">Scroll to discover the garden, library, cloister, kitchen and tree chapel.</div><div class="controls"><button id="left" aria-label="Move left">◀</button><button id="right" aria-label="Move right">▶</button><button id="hide">Hide labels</button></div><div class="progress"><i id="bar"></i></div><script>
(()=>{'use strict';
const scene=document.getElementById('scene'),view=document.getElementById('view'),status=document.getElementById('status'),bar=document.getElementById('bar');
const WIDTH=10200, SPEED={cloud:.09,mountainsFar:.17,mountainsMid:.27,hills:.39,trees:.58,world:1,flowers:1.22,trunks:1.42,branches:1.59};
const layerNames=['cloud','mountainsFar','mountainsMid','hills','trees','world','flowers','trunks','branches'];const layers={};for(const name of layerNames){let e=document.createElement('div');e.className='layer';scene.appendChild(e);layers[name]=e}
let scroll=0,target=0,dragging=false,lastX=0,loaded=0,missing=0,labels=true;let vw=innerWidth,vh=innerHeight;const maxScroll=()=>Math.max(0,WIDTH-vw);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function asset(layer,folder,stem,x,y,w,opts={}){const img=document.createElement('img');img.className='asset '+(opts.className||'');img.alt='';img.decoding='async';img.loading='eager';img.style.width=w+'px';img.style.left=x+'px';img.style.top=y+'%';img.dataset.x=x;img.dataset.layer=layer;img.dataset.flip=opts.flip?'1':'0';img.dataset.scale=opts.scale||1;img.style.opacity=opts.opacity??1;layers[layer].appendChild(img);
let stems=[stem,...(opts.alternates||[])];let paths=[];for(let s of stems)for(let ext of ['PNG','png','webp','WEBP'])paths.push('assets/'+folder+'/'+s+'.'+ext);let i=0;img.onload=()=>{loaded++;updateStatus()};img.onerror=()=>{if(++i<paths.length)img.src=paths[i];else{missing++;img.remove();updateStatus()}};img.src=paths[0];return img}
function updateStatus(){status.textContent=loaded+' images loaded · '+missing+' not found (the world still works)'}
// Background is a CSS blue gradient. Every image is a separate transparent asset.
const clouds=['clouds-01','clouds-02','clouds-03','clouds-04','clouds-05'];for(let i=0;i<15;i++)asset('cloud','clouds',clouds[i%clouds.length],i*720-300,3+(i%4)*7,380+(i%3)*105,{opacity:.65,flip:i%3===0});
for(let i=0;i<13;i++)asset('mountainsFar','mountains',['mountains-far-01','mountains-far-02','mountains-far-03'][i%3],i*840-290,19+(i%3)*3,1020,{opacity:.64,flip:i%4===2,alternates:['mountains-01','mountains-02','mountains-03']});
for(let i=0;i<12;i++)asset('mountainsMid','mountains',['mountains-mid-01','mountains-mid-02','mountains-mid-03'][i%3],i*940-300,28+(i%3)*3,960,{opacity:.76,flip:i%3===1});
for(let i=0;i<13;i++)asset('hills','hills','hills-0'+(i%4+1),i*810-280,43+(i%3)*2,900,{flip:i%4===3,opacity:.91});
for(let i=0;i<17;i++)asset('trees','trees','trees-0'+(i%6+1),i*630-250,44+(i%4)*3,630+(i%3)*90,{flip:i%3===1,opacity:.94});
// World geometry: the path is continuous, and sites share stable world coordinates.
const world=document.createElement('div');world.className='world';world.style.width=WIDTH+'px';world.style.height='100%';layers.world.appendChild(world);
const el=(tag,cls,styles,parent=world)=>{const n=document.createElement(tag);n.className=cls;Object.assign(n.style,styles);parent.appendChild(n);return n};
el('div','ground',{left:'0px',width:WIDTH+'px'});el('div','path',{left:'0px',width:WIDTH+'px'});el('div','stream',{left:'0px',width:WIDTH+'px'});
function site(name,x,kind='building',height=0){let s=el('div','site',{left:x+'px',top:(70-height)+'%'});if(kind==='garden'){let g=el('div','garden',{},s);let beds=el('div','beds',{},g);for(let j=0;j<4;j++)el('div','bed',{},beds);el('div','stairs',{},s)}else{let b=el('div','building',{},s);el('div','roof',{},s);el('div','door',{},b);el('div','window a',{},b);el('div','window b',{},b)}let lab=el('div','site-label',{},s);lab.textContent=name;return s}
site('Elevated vegetable garden',570,'garden',7);site('Art studio',1620);site('Library',2540);site('Study & quiz workshop',3450);site('Cloister courtyard',4610);site('Marian grotto',5620,'garden',2);site('Kitchen',6570);site('Refectory',7550);site('Giant-tree chapel (placeholder)',8770);site('Marketplace',9720);
el('div','wheel',{left:'810px'});for(let i=0;i<45;i++){let p=el('div','little',{left:(i*227+90)+'px',top:(68+(i%4)*4)+'%'});p.textContent=['✿','❀','✧','🌿','✿'][i%5]}
// The flower, trunk and branch sprites are above the world, and move faster than it.
for(let i=0;i<25;i++)asset('flowers','foreground','flowers-'+String(i%10+1).padStart(2,'0'),i*445-160,72+(i%4)*5,280+(i%4)*95,{flip:i%3===0,scale:.8+(i%4)*.13});
for(let i=0;i<12;i++)asset('trunks','foreground','trunk-0'+(i%4+1),i*940+110,24+(i%3)*8,400+(i%3)*125,{flip:i%2===1,scale:1+(i%3)*.13});
// Sparse overhead branches, intentionally not a continuous ceiling.
for(let i=0;i<8;i++)asset('branches','foreground','branches-0'+(i%4+1),i*1450+300,-4+(i%3)*4,520+(i%2)*170,{flip:i%2===1,opacity:.96});
const all=[...scene.querySelectorAll('.asset')];
function frame(){scroll+=(target-scroll)*.13;if(Math.abs(target-scroll)<.08)scroll=target;for(let name of layerNames){let speed=SPEED[name];if(name==='world'){world.style.transform='translate3d('+(-scroll)+'px,0,0)';continue}layers[name].style.transform='translate3d('+(-scroll*speed)+'px,0,0)';}for(let a of all){let flip=a.dataset.flip==='1'?-1:1;a.style.transform='scaleX('+flip+') scale('+(a.dataset.scale||1)+')'}bar.style.width=(100*scroll/maxScroll())+'%';requestAnimationFrame(frame)}requestAnimationFrame(frame);
function move(dx){target=clamp(target+dx,0,maxScroll())}view.addEventListener('wheel',e=>{e.preventDefault();move((Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY)*1.4)},{passive:false});view.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;view.classList.add('dragging');view.setPointerCapture(e.pointerId)});view.addEventListener('pointermove',e=>{if(dragging){move((lastX-e.clientX)*1.4);lastX=e.clientX}});function end(){dragging=false;view.classList.remove('dragging')}view.addEventListener('pointerup',end);view.addEventListener('pointercancel',end);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(280);if(e.key==='ArrowLeft')move(-280)});document.getElementById('left').onclick=()=>move(-Math.round(vw*.75));document.getElementById('right').onclick=()=>move(Math.round(vw*.75));document.getElementById('hide').onclick=()=>{labels=!labels;document.querySelectorAll('.site-label').forEach(n=>n.classList.toggle('hidden',!labels));document.getElementById('hide').textContent=labels?'Hide labels':'Show labels'};addEventListener('resize',()=>{vw=innerWidth;vh=innerHeight;target=clamp(target,0,maxScroll())});updateStatus();
})();</script></body></html>
