<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aquinas Bub | Parallax Debug</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Georgia,serif;background:#bde6f4}button{cursor:pointer}#view{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;user-select:none}#view.dragging{cursor:grabbing}#scene{position:absolute;inset:0;overflow:hidden;background:linear-gradient(#78c4ed 0%,#bce6f6 44%,#fff2d7 100%)}.layer{position:absolute;inset:0;pointer-events:none;overflow:visible}.asset{position:absolute;max-width:none;object-fit:contain;pointer-events:none;transform-origin:center bottom;filter:drop-shadow(0 6px 8px #34552622)}.world{position:absolute;left:0;top:0;height:100%;transform-origin:top left;pointer-events:none}.ground{position:absolute;left:0;top:57%;height:48%;background:linear-gradient(#b4d48d,#8fbc6e 34%,#6b9f57);border-top:7px solid #d5df9e;border-radius:45% 45% 0 0/6% 7% 0 0}.path{position:absolute;left:0;top:76%;height:11%;background:#e8d7b2;border-top:5px solid #fff1d1;border-bottom:5px solid #bba47f;box-shadow:0 5px 0 #758f5a;border-radius:35% 35% 20% 20%/40% 40% 25% 25%}.path:after{content:'';position:absolute;inset:6px 0;background:repeating-linear-gradient(100deg,transparent 0 70px,#9e8d7044 72px 75px,transparent 77px 140px)}.stream{position:absolute;top:93%;height:14%;background:linear-gradient(#b5e5e5,#71b9c6 55%,#c1eeea);border-top:6px solid #b7c6a0}.stream:after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 70px,#ffffff88 78px 83px,transparent 88px 170px);animation:water 6s linear infinite}@keyframes water{to{background-position:170px 0}}.site{position:absolute;width:230px;height:190px;transform:translate(-50%,-100%);text-align:center}.building{position:absolute;bottom:0;left:15%;width:70%;height:65%;background:#f2dfb9;border:5px solid #947f66;border-radius:8px;box-shadow:9px 10px 0 #354c4028}.roof{position:absolute;bottom:62%;left:4%;width:92%;height:28%;background:#bf7b6a;clip-path:polygon(50% 0,100% 94%,0 94%)}.door{position:absolute;bottom:0;left:40%;width:22%;height:40%;background:#805d45;border:4px solid #674a36;border-radius:35px 35px 0 0}.window{position:absolute;top:32%;width:18%;height:22%;background:#a8d6d9;border:4px solid #806d59;border-radius:20px 20px 3px 3px}.window.a{left:13%}.window.b{right:13%}.site-label{position:absolute;bottom:-31px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff8e9ed;border:1px solid #c2b08e;border-radius:20px;padding:6px 11px;font:13px system-ui;color:#514332}.garden{position:absolute;bottom:0;left:3%;width:94%;height:56%;background:repeating-linear-gradient(90deg,#6e984d 0 24px,#a7c878 25px 34px,#8a6649 35px 43px);border:8px solid #a38b64;border-radius:25px}.stairs{position:absolute;left:43%;bottom:-38px;width:18%;height:40px;background:repeating-linear-gradient(#e9dabb 0 8px,#a99b80 9px 12px)}.wheel{position:absolute;top:83%;width:90px;height:90px;border:12px dashed #76533a;border-radius:50%;box-shadow:inset 0 0 0 7px #bc8c59;animation:spin 18s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.hud{position:fixed;z-index:40;top:calc(10px + env(safe-area-inset-top));left:12px;max-width:min(440px,calc(100vw - 24px));padding:11px 13px;border-radius:14px;background:#fff9e9ec;border:1px solid #d6c9ab;box-shadow:0 5px 20px #0002;color:#4c483c}.hud strong{font-size:16px}.hud small{display:block;font:12px/1.4 system-ui;margin-top:4px}.buttons{position:fixed;z-index:40;bottom:calc(18px + env(safe-area-inset-bottom));right:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.buttons button,.debug button{background:#fff9e9;color:#4d493d;border:1px solid #b9ac8c;border-radius:18px;padding:10px 13px;font:600 13px system-ui}.progress{position:fixed;bottom:0;left:0;width:100%;height:5px;background:#e7dec7;z-index:45}.progress i{display:block;width:0;height:100%;background:#638b61}.debug{position:fixed;z-index:60;inset:8% 5% 10%;background:#fffdf5;color:#302d26;border:2px solid #c9b58f;border-radius:16px;box-shadow:0 15px 65px #0006;display:none;flex-direction:column;overflow:hidden;font:13px/1.5 system-ui}.debug.open{display:flex}.debug header{padding:12px 15px;background:#eee7d6;display:flex;align-items:center;justify-content:space-between;gap:10px}.debug header strong{font-size:17px}.debug .body{padding:12px 15px;overflow:auto;flex:1}.debug pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 ui-monospace,monospace}.debug .note{font-size:12px;color:#6c5b43}.hidden{display:none!important}
</style>
</head>
<body>
<div id="view"><div id="scene"></div></div>
<div class="hud"><strong>✦ Aquinas Bub's Monastery</strong><small>Swipe sideways to explore. Temporary buildings, real watercolor scenery.</small><small id="status">Checking images…</small></div>
<div class="buttons"><button id="left">◀</button><button id="right">▶</button><button id="labels">Hide labels</button><button id="debugButton">Debug Images</button></div>
<div class="progress"><i id="bar"></i></div>
<div class="debug" id="debugPanel"><header><strong>Image Debug Report</strong><button id="closeDebug">Close ✕</button></header><div class="body"><div id="debugSummary"></div><p class="note">Each image is reused several times. This report groups failures by filename. Paths are relative to index.html. The page tries .PNG, .png, .WEBP, and .webp.</p><pre id="debugList"></pre><button id="copyDebug">Copy report</button></div></div>
<script>
(()=>{'use strict';
const scene=document.getElementById('scene'),view=document.getElementById('view'),status=document.getElementById('status'),bar=document.getElementById('bar');
const WIDTH=11200;
const SPEED={cloud:.08,far:.17,mid:.28,hills:.41,ground:1,trees:.72,world:1,flowers:1.13,trunks:1.30,branches:1.42};
const names=['cloud','far','mid','hills','ground','trees','world','flowers','trunks','branches'];
const layers={};for(const name of names){const n=document.createElement('div');n.className='layer';scene.appendChild(n);layers[name]=n}
let vw=innerWidth,scroll=0,target=0,dragging=false,lastX=0,loaded=0,failed=0,pending=0,labelsVisible=true;
const failures=new Map(),successes=new Set(),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),maxScroll=()=>Math.max(0,WIDTH-vw);
function updateStatus(){status.textContent=loaded+' placements loaded · '+failed+' failed · '+pending+' checking. Tap Debug Images for filenames.';if(document.getElementById('debugPanel').classList.contains('open'))renderDebug()}
function asset(layer,folder,stem,x,bottom,w,opts={}){
 const img=document.createElement('img');img.className='asset';img.alt='';img.decoding='async';img.loading='eager';img.style.left=x+'px';img.style.bottom=bottom+'%';img.style.width=w+'px';img.style.opacity=opts.opacity??1;
 img.style.transform='scaleX('+(opts.flip?-1:1)+') scale('+(opts.scale||1)+')';
 if(opts.blur)img.style.filter='blur('+opts.blur+'px)';layers[layer].appendChild(img);
 const key='assets/'+folder+'/'+stem;const extensions=['PNG','png','WEBP','webp'];let attempt=0,done=false;pending++;
 img.onload=()=>{if(done)return;done=true;pending--;loaded++;successes.add(key);updateStatus()};
 img.onerror=()=>{if(done)return;attempt++;if(attempt<extensions.length){img.src=key+'.'+extensions[attempt];return}done=true;pending--;failed++;failures.set(key,(failures.get(key)||0)+1);img.remove();updateStatus()};
 img.src=key+'.'+extensions[0];return img;
}
const clouds=['clouds-01','clouds-02','clouds-03','clouds-04','clouds-05'];
for(let i=0;i<16;i++)asset('cloud','clouds',clouds[i%5],i*730-250,62+(i%3)*9,380+(i%3)*90,{opacity:.65,flip:i%3===0});
for(let i=0;i<13;i++)asset('far','mountains','mountains-far-0'+(i%3+1),i*930-400,33+(i%3)*2,1100,{opacity:.66,flip:i%4===2});
for(let i=0;i<13;i++)asset('mid','mountains','mountains-mid-0'+(i%3+1),i*920-300,29+(i%3)*2,1000,{opacity:.8,flip:i%3===1});
for(let i=0;i<15;i++)asset('hills','hills','hills-0'+(i%4+1),i*770-250,25+(i%3)*2,870,{opacity:.92,flip:i%4===3});
function makeWorld(layer){const n=document.createElement('div');n.className='world';n.style.width=WIDTH+'px';layers[layer].appendChild(n);return n}
const terrain=makeWorld('ground');const world=makeWorld('world');
function el(parent,cls,css){const n=document.createElement('div');n.className=cls;Object.assign(n.style,css);parent.appendChild(n);return n}
el(terrain,'ground',{width:WIDTH+'px'});
for(let i=0;i<19;i++)asset('trees','trees','trees-0'+(i%6+1),i*605-180,19+(i%4)*2,560+(i%3)*100,{flip:i%3===1,opacity:.96});
el(world,'path',{width:WIDTH+'px'});el(world,'stream',{left:'0px',width:WIDTH+'px'});
function site(label,x,type='building',rise=0){const s=el(world,'site',{left:x+'px',top:(72-rise)+'%'});if(type==='garden'){el(s,'garden',{});el(s,'stairs',{})}else{const b=el(s,'building',{});el(s,'roof',{});el(b,'door',{});el(b,'window a',{});el(b,'window b',{})}const t=el(s,'site-label',{});t.textContent=label}
site('Elevated vegetable garden',570,'garden',7);site('Art studio',1640);site('Library',2600);site('Study workshop',3540);site('Cloister courtyard',4750);site('Marian grotto',5810,'garden',2);site('Kitchen',6820);site('Refectory',7860);site('Tree chapel',9140);site('Marketplace',10500);
el(world,'wheel',{left:'815px'});
for(let i=0;i<29;i++)asset('flowers','foreground','flowers-'+String(i%10+1).padStart(2,'0'),i*405-160,-4+(i%4)*3,290+(i%4)*90,{flip:i%3===0,scale:.85+(i%4)*.12});
for(let i=0;i<13;i++)asset('trunks','foreground','trunk-0'+(i%4+1),i*900+80,-6+(i%3)*2,440+(i%3)*130,{flip:i%2===1,scale:1+(i%3)*.1});
for(let i=0;i<8;i++)asset('branches','foreground','branches-0'+(i%4+1),i*1550+350,55+(i%3)*7,520+(i%2)*150,{flip:i%2===1});
function frame(){scroll+=(target-scroll)*.15;if(Math.abs(target-scroll)<.1)scroll=target;for(const name of names){if(name==='ground'){terrain.style.transform='translate3d('+(-scroll)+'px,0,0)'}else if(name==='world'){world.style.transform='translate3d('+(-scroll)+'px,0,0)'}else{layers[name].style.transform='translate3d('+(-scroll*SPEED[name])+'px,0,0)'}}bar.style.width=(maxScroll()?100*scroll/maxScroll():0)+'%';requestAnimationFrame(frame)}requestAnimationFrame(frame);
function move(dx){target=clamp(target+dx,0,maxScroll())}
view.addEventListener('wheel',e=>{e.preventDefault();move((Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY)*1.35)},{passive:false});
view.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;view.classList.add('dragging');view.setPointerCapture(e.pointerId)});
view.addEventListener('pointermove',e=>{if(dragging){move((lastX-e.clientX)*1.4);lastX=e.clientX}});
function end(){dragging=false;view.classList.remove('dragging')}view.addEventListener('pointerup',end);view.addEventListener('pointercancel',end);
document.getElementById('left').onclick=()=>move(-vw*.75);document.getElementById('right').onclick=()=>move(vw*.75);
document.getElementById('labels').onclick=()=>{labelsVisible=!labelsVisible;document.querySelectorAll('.site-label').forEach(n=>n.classList.toggle('hidden',!labelsVisible));document.getElementById('labels').textContent=labelsVisible?'Hide labels':'Show labels'};
function report(){const lines=['Aquinas Bub image report','Loaded placements: '+loaded,'Failed placements: '+failed,'Still checking: '+pending,'Unique files loaded: '+successes.size,'Unique missing paths: '+failures.size,'','MISSING FILES (number of failed placements):',...([...failures].sort((a,b)=>a[0].localeCompare(b[0])).map(([path,count])=>path+'.PNG   ('+count+' placements)'))];return lines.join('\n')}
function renderDebug(){document.getElementById('debugSummary').textContent=loaded+' loaded · '+failed+' failed · '+pending+' checking · '+failures.size+' distinct missing files';document.getElementById('debugList').textContent=failures.size?report():'No missing files reported yet.'}
document.getElementById('debugButton').onclick=()=>{document.getElementById('debugPanel').classList.add('open');renderDebug()};document.getElementById('closeDebug').onclick=()=>document.getElementById('debugPanel').classList.remove('open');
document.getElementById('copyDebug').onclick=()=>{const t=report();if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t).catch(()=>prompt('Copy report:',t));else prompt('Copy report:',t)};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(280);if(e.key==='ArrowLeft')move(-280)});addEventListener('resize',()=>{vw=innerWidth;target=clamp(target,0,maxScroll())});updateStatus();
})();
</script>
</body>
</html>
